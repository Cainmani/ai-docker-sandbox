# Dependabot config for ai-docker-sandbox — SECURITY UPDATES ONLY, frozen.
# Template and rationale: infra-cainmani templates/dependabot.yml (SOP-08 §3.2).
#
# Routine version updates are off (open-pull-requests-limit: 0). Security fixes,
# including vulnerable transitive dependencies, still arrive as one grouped PR
# per ecosystem. Image and upstream-release bumps come from Renovate
# (infra-cainmani/renovate-config.js), but this repo is NOT in its repositories
# list yet, so nothing proposes image bumps here. This file should not need
# editing.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies", "security"]
