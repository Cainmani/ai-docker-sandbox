name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# Prevent duplicate release builds if a tag is pushed multiple times
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    # ps2exe compiles PowerShell to a Windows .NET Framework .exe — Windows is required.
    # This job cannot run on the self-hosted Ubuntu runner.
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Verify release version sources
        shell: pwsh
        run: |
          $tagVersion = "${{ steps.get_version.outputs.VERSION }}"
          $sourceVersion = (Get-Content VERSION -Raw).Trim()
          if ($tagVersion -ne $sourceVersion) {
            throw "Release tag version $tagVersion does not match VERSION $sourceVersion"
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch ('(?m)^## \[' + [regex]::Escape($sourceVersion) + '\]')) {
            throw "CHANGELOG.md has no release heading for $sourceVersion"
          }

      - name: Install ps2exe
        shell: pwsh
        run: |
          Install-Module -Name ps2exe -RequiredVersion 1.0.17 -Force -Scope CurrentUser
          Import-Module ps2exe

      - name: Build executable
        shell: pwsh
        working-directory: scripts/build
        run: |
          # The build script embeds all files (docker configs, shell scripts, docs)
          # into the template and then compiles to .exe

          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Building from scripts/build directory..."

          # Run the build script directly (it handles paths relative to its location)
          # Use -NonInteractive and pipe 'Y' to handle any prompts
          & powershell.exe -ExecutionPolicy Bypass -File "build_complete_exe.ps1" -NonInteractive

      - name: Verify build
        shell: pwsh
        run: |
          $versionedName = "AI_Docker_Manager_v${{ steps.get_version.outputs.VERSION }}.exe"
          $outputPath = Join-Path $PWD $versionedName

          if (-not (Test-Path $outputPath)) {
            Write-Error "Build failed - output file $versionedName not found"
            exit 1
          }

          $expectedVersion = "${{ steps.get_version.outputs.VERSION }}.0"
          $actualVersion = (Get-Item $outputPath).VersionInfo.FileVersion
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable file version $actualVersion does not match expected $expectedVersion"
          }
          Write-Host "Build successful: $outputPath (file version $actualVersion)"
          Get-Item $outputPath | Select-Object Name, Length, LastWriteTime

          # Also publish a stable-named copy so the permanent
          # releases/latest/download/AI_Docker_Manager.exe link keeps working.
          Copy-Item $outputPath (Join-Path $PWD "AI_Docker_Manager.exe") -Force

      - name: Smoke-test the EXE under Restricted execution policy
        shell: pwsh
        run: |
          $versionedName = "AI_Docker_Manager_v${{ steps.get_version.outputs.VERSION }}.exe"
          & pwsh -NoProfile -File scripts/build/test_exe_smoke.ps1 -ExePath (Join-Path $PWD $versionedName)
          if ($LASTEXITCODE -ne 0) { throw "EXE smoke test failed - not releasing a broken launcher" }

      - name: Generate SHA256 checksums
        id: checksum
        shell: pwsh
        run: |
          $versionedName = "AI_Docker_Manager_v${{ steps.get_version.outputs.VERSION }}.exe"
          $hash = (Get-FileHash -Path $versionedName -Algorithm SHA256).Hash
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
          echo "$hash  $versionedName" | Out-File -FilePath "$versionedName.sha256" -Encoding utf8
          echo "$hash  AI_Docker_Manager.exe" | Out-File -FilePath "AI_Docker_Manager.exe.sha256" -Encoding utf8
          Write-Host "SHA256: $hash"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            AI_Docker_Manager_v${{ steps.get_version.outputs.VERSION }}.exe
            AI_Docker_Manager_v${{ steps.get_version.outputs.VERSION }}.exe.sha256
            AI_Docker_Manager.exe
            AI_Docker_Manager.exe.sha256
          body: |
            ## AI Docker CLI Manager ${{ github.ref_name }}

            ### Installation

            1. Download **`AI_Docker_Manager.exe`** below — this is the recommended, self-updating build. On launch it checks for a newer release and can install it in place, so you won't need to download again. (`AI_Docker_Manager_v${{ steps.get_version.outputs.VERSION }}.exe` is the same binary with the version pinned in the name, for archiving a specific version.)
            2. Run the executable (you may need to click "More info" → "Run anyway" on Windows SmartScreen)
            3. Click "First Time Setup" to begin

            ### SHA256 Checksum
            ```
            ${{ steps.checksum.outputs.SHA256 }}
            ```

            ### What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Requirements
            - Windows 10/11
            - Docker Desktop

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
