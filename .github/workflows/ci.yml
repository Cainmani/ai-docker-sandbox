name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict token to read-only — CI does not need write access
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()

          Get-ChildItem -Path "scripts/*.ps1" | ForEach-Object {
            Write-Host "Checking: $($_.Name)"
            try {
              $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$null)
              Write-Host "  ✓ Syntax OK" -ForegroundColor Green
            } catch {
              Write-Host "  ✗ Syntax Error: $($_.Exception.Message)" -ForegroundColor Red
              $errors += $_.FullName
            }
          }

          if ($errors.Count -gt 0) {
            Write-Error "Syntax errors found in: $($errors -join ', ')"
            exit 1
          }

      - name: Validate Dockerfile
        shell: bash
        run: |
          echo "Checking Dockerfile syntax..."
          if docker build --check -f docker/Dockerfile docker/ 2>/dev/null; then
            echo "✓ Dockerfile syntax OK"
          else
            # --check not available in all Docker versions, try basic validation
            if grep -q "^FROM" docker/Dockerfile; then
              echo "✓ Dockerfile has FROM instruction"
            else
              echo "✗ Dockerfile missing FROM instruction"
              exit 1
            fi
          fi

      - name: Check for common issues
        shell: pwsh
        run: |
          $issues = @()

          # Check for hardcoded paths that might not work on other systems
          $files = Get-ChildItem -Path "scripts/*.ps1" -Recurse
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            if ($content -match 'C:\\Users\\[^$]') {
              $issues += "$($file.Name): Contains hardcoded user path"
            }
          }

          # Check for TODO/FIXME comments
          $todoCount = (Get-ChildItem -Path "scripts/*.ps1" | Select-String -Pattern "TODO|FIXME" -AllMatches).Matches.Count
          if ($todoCount -gt 0) {
            Write-Host "Note: Found $todoCount TODO/FIXME comments" -ForegroundColor Yellow
          }

          if ($issues.Count -gt 0) {
            Write-Warning "Issues found:"
            $issues | ForEach-Object { Write-Warning "  - $_" }
          }

          Write-Host "Validation complete"

      - name: Install ShellCheck
        shell: bash
        run: |
          if ! command -v shellcheck &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Lint shell scripts (blocking errors)
        shell: bash
        run: |
          mapfile -t scripts < <(find docker tests -type f -name '*.sh' -print | sort)
          shellcheck --severity=error "${scripts[@]}"

      - name: Lint shell scripts (visible warnings)
        shell: bash
        continue-on-error: true
        run: |
          mapfile -t scripts < <(find docker tests -type f -name '*.sh' -print | sort)
          shellcheck --severity=warning "${scripts[@]}"

      - name: Lint Dockerfile (hadolint)
        shell: bash
        continue-on-error: true
        run: |
          if ! command -v hadolint &>/dev/null; then
            sudo curl -sL "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64" -o /usr/local/bin/hadolint
            sudo chmod +x /usr/local/bin/hadolint
          fi
          echo "hadolint version: $(hadolint --version)"
          echo ""
          hadolint docker/Dockerfile

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object Version -ge '5.0')) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.0
          }
          Import-Module Pester
          Write-Host "Pester version: $((Get-Module Pester).Version)"

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Filter.Tag = @()
          $config.Filter.ExcludeTag = @()
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'tests/results.xml'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Run bash tests
        shell: bash
        run: |
          exit_code=0
          for test_file in tests/test_*.sh; do
            echo "=== Running $test_file ==="
            chmod +x "$test_file"
            if ! bash "$test_file"; then
              echo "FAILED: $test_file"
              exit_code=1
            fi
          done
          exit $exit_code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results
          path: tests/results.xml

  windows-pester:
    name: Pester (${{ matrix.shell_name }})
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - shell_name: Windows PowerShell 5.1
            shell: powershell
          - shell_name: PowerShell 7
            shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Two steps guarded by matrix.shell rather than `shell: ${{ matrix.shell }}`:
      # GitHub does not accept the matrix context in the step `shell` key, so we
      # branch explicitly to run the same Pester invocation under each shell.
      - name: Install and run Pester (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object Version -ge '5.0')) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.0 -Scope CurrentUser
          }
          Import-Module Pester
          $result = Invoke-Pester -Path tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Install and run Pester (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object Version -ge '5.0')) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.0 -Scope CurrentUser
          }
          Import-Module Pester
          $result = Invoke-Pester -Path tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  exe-smoke:
    # Build the real EXE with ps2exe and launch it under the Windows DEFAULT
    # (Restricted) execution policy. Every other suite tests the scripts; this
    # is the only check that exercises the compiled artifact, catching bugs
    # that exist only inside the ps2exe host (e.g. the v1.4.0 in-process
    # dot-sourcing that the execution policy blocked).
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ps2exe
        shell: pwsh
        run: |
          Install-Module -Name ps2exe -RequiredVersion 1.0.17 -Force -Scope CurrentUser
          Import-Module ps2exe

      - name: Build executable
        shell: pwsh
        working-directory: scripts/build
        run: |
          & powershell.exe -ExecutionPolicy Bypass -File "build_complete_exe.ps1" -NonInteractive

      - name: Smoke-test the EXE under Restricted execution policy
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $exePath = Join-Path $PWD "AI_Docker_Manager_v$version.exe"
          & pwsh -NoProfile -File scripts/build/test_exe_smoke.ps1 -ExePath $exePath
          if ($LASTEXITCODE -ne 0) { throw "EXE smoke test failed" }

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify release version sources
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION is not semantic: $version" }
          foreach ($path in @('scripts/AI_Docker_Complete.ps1', 'scripts/AI_Docker_Launcher.ps1')) {
            $content = Get-Content $path -Raw
            if ($content -notmatch ('\$script:AppVersion\s*=\s*"' + [regex]::Escape($version) + '"')) {
              throw "$path AppVersion does not match VERSION $version"
            }
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch ('(?m)^## \[' + [regex]::Escape($version) + '\]')) {
            throw "Latest release $version is missing from CHANGELOG.md"
          }
          # The container baseline gates the "Container Update Recommended"
          # dialog; it must exist, parse, and never exceed the release version.
          $complete = Get-Content scripts/AI_Docker_Complete.ps1 -Raw
          if ($complete -notmatch '\$script:ContainerBaselineVersion\s*=\s*"(\d+\.\d+\.\d+)"') {
            throw "scripts/AI_Docker_Complete.ps1 is missing ContainerBaselineVersion"
          }
          if ([Version]$Matches[1] -gt [Version]$version) {
            throw "ContainerBaselineVersion $($Matches[1]) is newer than VERSION $version"
          }
          # The wizard must propagate the product version into docker/.env, or the
          # built image silently falls back to the compose default (0.0.0), which
          # the version-skew check would misread as a legacy image.
          $wizard = Get-Content scripts/setup_wizard.ps1 -Raw
          if ($wizard -notmatch "Set-EnvKey[^\r\n]*'AI_DOCKER_VERSION'") {
            throw "setup_wizard.ps1 does not propagate AI_DOCKER_VERSION into docker/.env"
          }
          # The wizard must also size the container CPU limit to the chosen WSL
          # profile, or docker-compose.yml caps every install at the 2-core floor.
          if ($wizard -notmatch "Set-EnvKey[^\r\n]*'AI_DOCKER_CPU_LIMIT'") {
            throw "setup_wizard.ps1 does not propagate AI_DOCKER_CPU_LIMIT into docker/.env"
          }
