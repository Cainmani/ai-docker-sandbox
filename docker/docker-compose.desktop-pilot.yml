# Standalone: never combine with the production/mobile Compose files.
name: ai-docker-desktop-pilot
services:
  pilot:
    build:
      context: .
      args:
        AI_DOCKER_VERSION: ${AI_DOCKER_VERSION:-1.7.0}
    image: ai-docker-desktop-pilot:local
    container_name: ai-desktop-pilot
    restart: 'no'
    security_opt:
      - seccomp=unconfined
    environment:
      USER_NAME: pilot
      ENABLE_DESKTOP_PILOT: '1'
      ENABLE_MOBILE_ACCESS: '0'
      AI_DOCKER_STARTUP_UPDATE: '0'
    ports:
      - '127.0.0.1:2222:2222'
    volumes:
      - type: bind
        source: ${PILOT_WORKSPACE:?Select a synthetic or public workspace}
        target: /workspace
      - type: bind
        source: ${PILOT_PUBLIC_KEY:?Select a public SSH key}
        target: /run/pilot-key.pub
        read_only: true
      - pilot-home:/home/pilot
    secrets:
      - user_password
    tty: true
    stdin_open: true
volumes:
  pilot-home:
secrets:
  user_password:
    file: ${PILOT_PASSWORD_FILE:?Provide the disposable password file}
