# Fixed project name so container/image/volume/network identity does not depend
# on the folder the compose file happens to live in (docker/ in the source repo,
# docker-files/ in the packaged .exe layout).
name: ai-docker

services:
  ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AI_DOCKER_VERSION: ${AI_DOCKER_VERSION:-0.0.0}
        # Proxy passthrough for corporate networks (predefined Docker build args)
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    # Fixed image name - referenced by the setup wizard and launchers
    image: ai-docker-cli:latest
    container_name: ai-cli
    environment:
      USER_NAME: ${USER_NAME}
      # Vibe Kanban configuration
      VIBE_KANBAN_PORT: ${VIBE_KANBAN_PORT:-3000}
      # AI router dashboard port (shared by 9router and OmniRoute - only one runs at a time)
      AI_ROUTER_PORT: ${AI_ROUTER_PORT:-20128}
      # Mobile access configuration (SSH + Mosh + tmux)
      # Set ENABLE_MOBILE_ACCESS=1 AND include docker-compose.mobile.yml to enable
      # remote access from mobile devices (the override file publishes the ports)
      ENABLE_MOBILE_ACCESS: ${ENABLE_MOBILE_ACCESS:-0}
      SSH_PORT: ${SSH_PORT:-2222}
      MOSH_PORT_START: ${MOSH_PORT_START:-60001}
      MOSH_PORT_END: ${MOSH_PORT_END:-60005}
      # Proxy passthrough for tools running inside the container
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-}
      all_proxy: ${ALL_PROXY:-}
      # Optional corporate CA bundle. Mount it with docker-compose.ca.yml as
      # documented in docs/REMOTE_ACCESS.md, then standard TLS clients use it.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}
      CUSTOM_CA_CERT: ${CUSTOM_CA_CERT:-}
    secrets:
      - user_password
    ports:
      # Both web UIs below are published on the host loopback interface ONLY. Without the
      # 127.0.0.1 prefix Docker binds 0.0.0.0 on the host, exposing these dashboards (the
      # router one holds linked AI provider credentials and has no authentication) to the
      # local network. Mobile/remote access goes through SSH in docker-compose.mobile.yml,
      # not through these ports.
      # Vibe Kanban web UI - accessible from Windows browser at http://localhost:3000
      - "127.0.0.1:${VIBE_KANBAN_PORT:-3000}:${VIBE_KANBAN_PORT:-3000}"
      # AI router dashboard (9router or OmniRoute) - reachable from the Windows browser at
      # http://localhost:20128/dashboard. One shared port; only one router runs at a time.
      - "127.0.0.1:${AI_ROUTER_PORT:-20128}:${AI_ROUTER_PORT:-20128}"
      # SSH/Mosh ports for mobile access are published by docker-compose.mobile.yml,
      # which is only included when mobile access is enabled.
    volumes:
      - ${WORKSPACE_PATH}:/workspace
      - claude-config:/home/${USER_NAME}/.claude
      # Vibe Kanban data persistence
      - vibe-kanban-data:/home/${USER_NAME}/.vibe-kanban
      # SSH keys persistence for mobile access
      - ssh-keys:/home/${USER_NAME}/.ssh
      # Tool auth persistence (survives container rebuilds)
      - tool-auth:/home/${USER_NAME}/.tool-auth
      # AI router data persistence (9router / OmniRoute SQLite DB + linked provider credentials)
      - router-data:/home/${USER_NAME}/.router-data
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/ai-docker-ready && grep -q '^ENTRYPOINT=ok$' /run/ai-docker-ready && grep -Eq '^INSTALL_STATUS=(ok|legacy)$' /run/ai-docker-ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          # 2.0 is a safe floor for 2-core hosts and CI runners. The setup wizard
          # writes AI_DOCKER_CPU_LIMIT into docker/.env sized to the chosen WSL
          # profile (Light=2, Standard=4, Heavy=6, capped by real cores), so real
          # installs on larger machines get right-sized. Override in .env for
          # hand-run compose.
          cpus: '${AI_DOCKER_CPU_LIMIT:-2.0}'

# Docker secrets for secure password handling
# Password is stored in tmpfs (memory-only) at /run/secrets/user_password
secrets:
  user_password:
    file: .secrets/password.txt

volumes:
  claude-config:
    driver: local
  vibe-kanban-data:
    driver: local
  ssh-keys:
    driver: local
  tool-auth:
    driver: local
  router-data:
    driver: local
